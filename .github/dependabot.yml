version: 2

updates:
  - package-ecosystem: cargo
    directory: /bot
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine patch churn; anything that could actually break
      # the build still arrives on its own.
      patch-updates:
        update-types: [patch]

  - package-ecosystem: pip
    directory: /detector
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directories:
      - /bot
      - /detector
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
