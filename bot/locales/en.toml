developer_channel = "👨‍💻 Developer's channel: {channel}"
help_body = """
<b>How detection works</b>

When someone comments in a protected group I look at:
• their profile photo (current and previous)
• any text written on that photo
• their bio, name and @username
• media inside the comment itself
• whether they have been banned for the same reason elsewhere

Those signals feed a filter mode chosen by each group's admins, so a group can require an NSFW photo alone, or an NSFW photo <i>plus</i> advertising, before anyone is removed.

<b>Setting it up</b>
1. Add me to the group
2. Promote me with <b>Delete messages</b> and <b>Ban users</b>
3. Send /nsfw and pick your threshold and filter mode
4. Leave test mode on for a week, then switch it off

<b>Privacy</b>
I only read what Telegram already shows publicly, and I store scores — never your photos."""
