وبشكل منفصل، ومعطّلاً حتى تفعّله بنفسك، يمكنني فحص الصور وصور GIF والملصقات والفيديوهات المنشورة في المجموعة. ذلك الفحص عن الصورة نفسها لا عن الحساب: يشمل كل الأعضاء مهما طالت عضويتهم، وله حدّه وإجراؤه الخاصان — ‏٩٠٪ والحذف فقط افتراضياً، مقابل ‏٤٠٪ والحظر للملفات الشخصية.

لا تُقيَّم صور GIF والفيديوهات بصورة المعاينة. آخذ عدة لقطات من كامل طول المقطع، لأن المقطع الذي يبدأ بريئاً ثم يصبح إباحياً حيلة معروفة.

<b>ما يكتبه الأعضاء</b>

معطّل أيضاً حتى تفعّله: يمكنني تقدير مدى ارتباط كل رسالة بمواضيع تختارها — محتوى جنسي، عنف، خطاب كراهية، إهانات، مخدرات، مقامرة، احتيال، سياسة، دين — والتصرّف فوق درجة ثقة تحدّدها. وبشكل منفصل، يلتقط مانع الإعلانات الرسائل التي غرضها نقل الناس إلى مكان آخر؛ وهو يردّ افتراضياً بتحذير علني بدل الحذف، لأن معظم من ينشر رابطاً في مجموعة عضو فيها لا مُرسل إزعاج.

<b>التفاعلات</b>

يمكنني تطبيق فحوص الملف الشخصي نفسها على الحسابات التي تتفاعل مع الرسائل، لا التي تكتب فقط — فالتفاعل يضع ملفاً مزعجاً أمام المجموعة كلها دون إرسال أي شيء يمكن حذفه. ولا يُمسّ شيء يخص غيره: الرسالة التي وقع التفاعل تحتها لا تُحذف أبداً.

<b>الإعداد</b>
١. أضفني إلى المجموعة
٢. رقّني مع صلاحيتَي <b>حذف الرسائل</b> و<b>حظر المستخدمين</b>
٣. أرسل /nsfw واختر الحد ونمط التصفية
٤. فعّل 🖼 فحص الوسائط إن أردت فحص الصور المنشورة أيضاً
٥. اترك الوضع التجريبي أسبوعاً ثم أوقفه

<b>الخصوصية</b>
أقرأ فقط ما يعرضه تيليجرام علناً أصلاً، وأخزّن الدرجات فقط — لا صورك."""
